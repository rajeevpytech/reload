<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="40%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8F6B28" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1A14" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Outer Stylized Diamond Frame -->
  <polygon points="256,64 432,256 256,448 80,256" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.25" />

  <!-- Monogram R / RC -->
  <g transform="translate(140, 120)">
    <!-- Main R stem -->
    <rect x="24" y="24" width="36" height="224" rx="10" fill="url(#goldGrad)" />
    <!-- R loop -->
    <path d="M50 24 H145 C190 24 215 52 215 95 C215 138 185 165 140 165 H50 Z" fill="none" stroke="url(#goldGrad)" stroke-width="34" stroke-linejoin="round" stroke-linecap="round" />
    <!-- R leg -->
    <path d="M125 155 L210 248" fill="none" stroke="url(#goldGrad)" stroke-width="36" stroke-linecap="round" />
    <!-- Center Luxury Sparkle -->
    <circle cx="215" cy="50" r="10" fill="#FFF2B2" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="415" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="800" letter-spacing="12" fill="url(#goldGrad)" text-anchor="middle">RELOAD</text>
  <text x="256" y="445" font-family="'Montserrat', 'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="8" fill="#A38341" text-anchor="middle">CASUAL</text>
</svg>
